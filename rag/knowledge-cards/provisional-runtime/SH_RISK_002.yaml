id: SH_RISK_002
title_zh: 不能用低中高风险分层预测或决定处置
retrieval_examples_zh:
- 自杀风险可以分成低中高，然后据此判断能不能出院吗？
retrieval_text_zh: 出现自伤、自杀念头，想把自己或别人分成低风险、中风险、高风险，是否安全或可出院。不能用全局风险等级预测自杀或再次自伤、决定治疗或出院，应关注个体需求；涉及当下安全时采用固定转介提示。
type: RISK_RULE
title: No LOW/MEDIUM/HIGH stratification for prediction/disposition
clinical_claim: Do not use global low/medium/high risk stratification to predict suicide/repetition or
  to decide treatment/discharge; use needs-focused assessment and risk formulation.
