id: PSY_BELIEF_001
title_zh: 感觉被针对不足以判断妄想
retrieval_examples_zh:
- 我怀疑有人一直暗中监视我，觉得大家都在针对我。
retrieval_text_zh: 我觉得有人针对我、监视我、别人都在议论我，有不寻常的想法，是不是妄想或精神分裂症。仅有这些表述不能下结论，应了解确信程度、其他可能解释，以及身体、物质和心理状态。
type: INSUFFICIENT_FOR
title: Unusual belief insufficient for delusion
clinical_claim: A report of feeling targeted/unusual belief content alone does not establish a delusion;
  assessment must address conviction/alternatives and medical/substance/psychiatric domains (CG178 comprehensive
  assessment). CDDR notes subtlety of psychotic vs non-psychotic preoccupations in mood contexts — not
  a standalone delusion definition rewrite.
