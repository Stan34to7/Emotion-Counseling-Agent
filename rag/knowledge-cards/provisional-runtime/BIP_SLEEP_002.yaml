id: BIP_SLEEP_002
title_zh: 睡眠时间短不足以判断躁狂
retrieval_examples_zh:
- 我这几天熬夜睡得很少，仅凭这个就能判断躁狂吗？
retrieval_text_zh: 最近睡得少、熬夜、每天睡几个小时，是否就是躁狂、轻躁狂或双相情感障碍。仅凭睡眠时间减少不足以判断，必须了解是否不需要睡眠、精力及伴随的情绪高涨和活动变化。
