id: RDOC_LIM_001
title_zh: RDoC 是研究框架而不是诊断系统
retrieval_examples_zh:
- RDoC 研究领域标准能直接作为诊断工具吗？
retrieval_text_zh: RDoC、研究领域标准、情绪认知功能构念能否直接诊断心理疾病。RDoC 是研究正常到异常功能领域的框架，不是诊断分类系统，不能直接据此得出 ICD 诊断。
