id: ANX_ASSESS_001
title_zh: 焦虑和持续担忧需要综合了解
retrieval_examples_zh:
- 还没考试就怕考砸，一想到未来就紧张，晚上反复担心。
retrieval_text_zh: 最近总担心考试失败、学习工作压力大，焦虑紧张、心慌、坐立不安、反复担忧，晚上因担心而睡不着。不能只看焦虑症状的数量或持续时间，还需了解痛苦程度、学习工作和生活影响，以及其他心理、身体和物质因素。
type: INTERVIEW_PROBE
