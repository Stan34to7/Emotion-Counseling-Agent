id: BIP_SLEEP_001
title_zh: 区分睡眠需求减少和想睡却睡不着
retrieval_examples_zh:
- 晚上睡两三个小时也完全不困，白天仍然很有劲。
retrieval_text_zh: 每天只睡三四小时却不困、精力充沛，与很想睡却睡不着、白天困倦的失眠不同。需要询问睡眠需求、白天精力、情绪和活动变化，并考虑主动熬夜、作息和物质影响；不能据此直接判断躁狂或双相。
