id: ADHD_DX_002
title_zh: ADHD 评估需要多个场景的功能影响
retrieval_examples_zh:
- 在学校上课老是分心，在家做事反而能集中注意力。
retrieval_text_zh: 上课时注意力不集中，在家却能专注；只在工作或学习一个场景表现多动、冲动，是否就是 ADHD。需要了解至少两个重要场景中的经常性表现，以及是否造成至少中等程度的功能损害，不能仅凭单一场景判断。
