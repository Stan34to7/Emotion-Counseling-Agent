id: DEP_ASSESS_001
title_zh: 抑郁相关困扰不能只数症状
retrieval_examples_zh:
- 几个星期做什么都提不起劲，也不觉得快乐，学习生活都受影响。
retrieval_text_zh: 持续情绪低落、没有兴趣、缺乏精力，怀疑自己抑郁，做了自测或数症状。需要了解严重程度、既往经历、持续时间、变化过程和学习工作生活影响，也要询问曾经情绪高涨的经历，不能只凭症状数量判断。
type: INTERVIEW_PROBE
title: Depression assessment beyond symptom count
clinical_claim: Depression assessment must not rely simply on symptom count; include severity, previous
  history, duration/course, functional impairment/disability, episode length, and factors including history
  of mood elevation.
