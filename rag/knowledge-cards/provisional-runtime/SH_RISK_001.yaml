id: SH_RISK_001
title_zh: 不能用风险量表预测自伤或自杀
retrieval_examples_zh:
- 我不想活了，想死，想伤害自己。
retrieval_text_zh: 伤害自己、自伤、自杀念头、想死、不想活了、结束生命，或想用风险量表和分数预测未来自伤概率。不能用量表预测自杀或再次自伤，也不能仅据分数决定治疗或出院；涉及当下安全时采用固定转介提示。
type: RISK_RULE
