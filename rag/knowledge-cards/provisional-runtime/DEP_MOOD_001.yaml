id: DEP_MOOD_001
title_zh: 情绪低落不足以判断抑郁障碍
retrieval_examples_zh:
- 最近心情不好，很难过，伤心想哭。
retrieval_text_zh: 最近很难过、心情低落、伤心想哭、觉得没劲，担心自己是不是抑郁了。单凭情绪低落不能诊断抑郁障碍或抑郁发作，需要了解持续多久、严重程度、日常生活影响及其他相关表现。
