# Soullink 站点配置 - 整合版

server {
    listen 5000;
    server_name _;

    # ========================================================
    # 1. 全局上传限制
    # ========================================================
    # 允许最大 500MB 的请求体（解决图生3D时 Base64 图片太大的问题）
    client_max_body_size 500m;
    # 增加缓冲区，处理大体积 Base64 字符串更顺畅
    client_body_buffer_size 10m;
    # 客户端上传数据超时时间
    client_body_timeout 600s;

    # ========================================================
    # 2. Hunyuan3D 专用接口（解决 504 Gateway Time-out）
    # ========================================================
    # 必须放在 / 之前，确保优先匹配
    location /api/hunyuan3d/ {
        # 转发到你的后端服务（假设是 5002 或 19500 对应的本地端口）
        # 如果是 Flask 统一处理，这里保持和下面 location / 一致即可
        proxy_pass http://127.0.0.1:5002; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- 核心超时优化 ---
        # 建立连接、发送请求、读取响应分别给 15 分钟（900秒）
        # 保证复杂的模型生成不会被 Nginx 掐断
        proxy_connect_timeout 900s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;

        # --- 传输优化 ---
        # 关闭请求缓冲：一边收一边传，减少连接重置(Reset)风险
        proxy_request_buffering off;
        # 关闭响应缓冲：后端生成一点就传回一点，保持连接活跃
        proxy_buffering off;
    }

    # ========================================================
    # 3. 通用 HTTP 接口（转发到 Flask 5002）
    # ========================================================
    location / {
        proxy_pass         http://127.0.0.1:5002;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 通用接口也给 5 分钟超时，防止普通请求卡顿
        proxy_connect_timeout 120s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 默认开启缓冲
        proxy_request_buffering on;
    }

    # ========================================================
    # 4. WebSocket 音频通道（转发到 10002）
    # ========================================================
    location /human_ws {
        proxy_pass         http://127.0.0.1:10002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket 保持 1 小时不断连
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
    location = /llm {
        return 308 /llm/;
}    
    location ^~ /llm/ {
        proxy_pass http://192.168.11.28:8000/v1/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_read_timeout 3600s;
}

	


    # Clinical expert API (psychology skill)
    location /clinical-expert/ {
        proxy_pass http://127.0.0.1:18765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

}