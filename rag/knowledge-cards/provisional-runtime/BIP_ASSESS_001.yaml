id: BIP_ASSESS_001
title_zh: 情绪高涨和活动增多需要了解完整经历
retrieval_examples_zh:
- 最近一会儿兴奋话多做事冲动，一会儿情绪低落。
retrieval_text_zh: 一段时间特别兴奋、精力旺盛、话多、活动增多或做事失去节制，担心双相情感障碍。需要了解详细情绪历史、高涨和低落的变化、诱因、家庭经历、生活影响、身体健康和用药等，不能凭一项表现判断。
