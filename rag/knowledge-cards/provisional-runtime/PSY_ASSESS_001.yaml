id: PSY_ASSESS_001
title_zh: 异常感知与信念需要多方面了解
retrieval_examples_zh:
- 最近出现了奇怪的感知体验，我想了解评估时需要考虑哪些方面。
retrieval_text_zh: 异常的感知或信念、精神病性体验，担心自己的精神状态。综合评估应了解心理和精神状态、身体健康、发展经历、家庭社交、学习工作及生活质量等多个领域，不能只看一句话或一项症状。
