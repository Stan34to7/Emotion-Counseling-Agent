id: ADHD_DX_001
title_zh: ADHD 需要完整专业评估
retrieval_examples_zh:
- 网上多动症量表的分数很高，我想知道需要怎样进一步评估。
retrieval_text_zh: 注意缺陷、多动、冲动，网上做了多动症量表，自测分数高就能诊断 ADHD 吗。评估不能只看量表，应由专业人员结合临床和社会心理评估、发展和精神科历史、他人观察及精神状态进行。
